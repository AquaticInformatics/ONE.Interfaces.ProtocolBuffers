syntax = "proto3";


option csharp_namespace = "ONE.Models.CSharp.Instrument";

import "google/protobuf/timestamp.proto";
import "instrument_status_metadata.proto";

message InstrumentErrorNotificationStatus
{
    // Instrument Digital Twin identifier.
    string instrumentId = 1;

    // location Id
    string authEnterpriseTwinRefId = 2;

    // Collection of active errors with their notification state.
    repeated ErrorNotificationStates errors = 3;
}

message ErrorNotificationState
{
    // Error status metadata.
    StatusMetadata error = 1;

    // Timestamp when notification was sent.
    google.protobuf.Timestamp notifiedAtUtc = 2;
}

message ErrorNotificationStates{
  repeated ErrorNotificationState items = 1;
}

message InstrumentErrorNotificationStatuses {
  repeated InstrumentErrorNotificationStatus items = 1;
    // UTC timestamp when this error was last included in a summary notification.
    google.protobuf.Timestamp lastSummarySentAtUtc = 2;
}
