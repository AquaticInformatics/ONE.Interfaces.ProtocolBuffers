syntax = "proto3";

import "instrument_twin.proto";
import "instrument_summary.proto";
import "instrument_twin_type.proto";
import "instrument_twin_sub_type.proto";
import "instrument_data.proto";
import "compliance_notification_settings.proto";
import "telemetry_compliance_limits.proto";


option csharp_namespace ="ONE.Models.CSharp.Instrument";

message InstrumentHealth {
    InstrumentTwins instrumentTwins = 1;
    InstrumentSummaries instrumentSummaries = 2;
    InstrumentTwinTypes instrumentTwinTypes = 3;
    InstrumentTwinSubTypes instrumentTwinSubTypes = 4;
    InstrumentDatas instrumentDatas = 5;
    InstrumentComplianceNotificationSettings instrumentComplianceNotificationSettings = 6;
    InstrumentTelemetryComplianceLimits instrumentTelemetryComplianceLimits = 7;
    InstrumentTelemetryComplianceLimitGroups instrumentTelemetryComplianceLimitGroups = 8;
}
